<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DEEP – Taucher im Riff</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #010a14;
      color: #e6f7ff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 160vh);
      aspect-ratio: 16 / 10;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(0, 140, 200, 0.25);
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: clamp(12px, 2.2vw, 16px);
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
    #hud b { color: #7fe7ff; font-size: 1.15em; }
    #hud .back {
      margin-left: auto;
      color: #9fd8ef;
      text-decoration: none;
      pointer-events: auto;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(0, 14, 28, 0.55);
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
    }
    #overlay[hidden] { display: none; }
    #ovTitle {
      font-size: clamp(34px, 7vw, 72px);
      font-weight: 800;
      letter-spacing: 0.12em;
      margin: 0 0 8px;
      text-shadow: 0 0 18px #00c3ff, 0 3px 6px #000;
    }
    #ovMsg {
      font-size: clamp(14px, 2.4vw, 19px);
      line-height: 1.55;
      max-width: 620px;
      text-shadow: 0 1px 3px #000;
    }
    #ovMsg kbd {
      background: #0c2a40;
      border: 1px solid #2a6d8f;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="600" aria-label="DEEP Spiel"></canvas>
    <div id="hud">
      <span>DISTANZ <b id="dist">0</b> m</span>
      <span>UMSCHWOMMEN <b id="passed">0</b></span>
      <span>BEST <b id="best">0</b> m</span>
      <a class="back" href="../">← UFO-Jagd</a>
    </div>
    <div id="overlay">
      <h1 id="ovTitle">DEEP</h1>
      <div id="ovMsg"></div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
