<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DEEP – Taucher im Riff</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #010a14;
      color: #e6f7ff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 160vh);
      aspect-ratio: 16 / 10;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(0, 140, 200, 0.25), 0 18px 70px rgba(0, 0, 0, 0.45);
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
      font-size: clamp(12px, 2.2vw, 16px);
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
    #hud b { color: #7fe7ff; font-size: 1.15em; }
    #hud .back {
      margin-left: auto;
      color: #9fd8ef;
      text-decoration: none;
      pointer-events: auto;
    }
    /* Sauerstoff-Leiste */
    #o2box {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 150px;
    }
    #o2bar {
      display: inline-block;
      position: relative;
      width: 110px;
      height: 10px;
      border-radius: 6px;
      background: rgba(2, 20, 34, 0.75);
      border: 1px solid rgba(140, 220, 255, 0.45);
      overflow: hidden;
    }
    #o2fill {
      position: absolute;
      inset: 0;
      width: 60%;
      background: #4fe3a1;
      border-radius: 6px;
      transition: width 0.15s linear, background 0.3s linear;
    }
    #o2label { font-variant-numeric: tabular-nums; }
    /* Aktive Power-Ups */
    #effects {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: 4px;
    }
    #effects .fx {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.82em;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: rgba(2, 20, 34, 0.7);
      border: 1px solid currentColor;
      font-variant-numeric: tabular-nums;
    }
    .fx-shield { color: #ffd465; }
    .fx-turbo { color: #ff8a3d; }
    .fx-magnet { color: #c79bff; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(0, 14, 28, 0.55);
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
    }
    #overlay[hidden] { display: none; }
    #ovTitle {
      font-size: clamp(34px, 7vw, 72px);
      font-weight: 800;
      letter-spacing: 0.12em;
      margin: 0 0 8px;
      text-shadow: 0 0 18px #00c3ff, 0 3px 6px #000;
    }
    #ovMsg {
      font-size: clamp(14px, 2.4vw, 19px);
      line-height: 1.55;
      max-width: 620px;
      text-shadow: 0 1px 3px #000;
      padding: 18px 24px;
      border: 1px solid rgba(135, 224, 255, 0.35);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(4, 34, 55, 0.78), rgba(1, 12, 25, 0.82));
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.28), inset 0 1px rgba(225, 250, 255, 0.08);
      backdrop-filter: blur(8px);
      max-height: 76vh;
      overflow-y: auto;
    }
    #ovMsg kbd {
      background: #0c2a40;
      border: 1px solid #2a6d8f;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
    }
    @media (max-width: 600px) {
      #hud { gap: 7px 11px; top: 7px; left: 9px; right: 9px; font-size: 11px; }
      #o2box { min-width: 118px; }
      #o2bar { width: 76px; }
      #ovMsg { padding: 14px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="600" aria-label="DEEP Spiel"></canvas>
    <div id="hud">
      <span>DISTANZ <b id="dist">0</b> m</span>
      <span>UMSCHWOMMEN <b id="passed">0</b></span>
      <span>PERLEN <b id="coins">0</b></span>
      <span>PUNKTE <b id="score">0</b></span>
      <span>BEST <b id="best">0</b> m</span>
      <span id="o2box">
        O₂
        <span id="o2bar"><span id="o2fill"></span></span>
        <b id="o2label">60</b>
      </span>
      <span id="effects"></span>
      <a class="back" href="../">← UFO-Jagd</a>
    </div>
    <div id="overlay">
      <h1 id="ovTitle">DEEP</h1>
      <div id="ovMsg"></div>
    </div>
  </div>
  <script src="game.js?v=20261105-hybrid-auto-pause"></script>
</body>
</html>
